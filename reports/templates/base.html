<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <style>
    /* ── Page setup ── */
    @page {
      size: A4;
      margin: 20mm 18mm 25mm 18mm;
      @bottom-center {
        content: "System generated, subject to officer approval  |  Page " counter(page) " of " counter(pages);
        font-size: 8pt;
        color: #555;
        font-family: Arial, sans-serif;
      }
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      font-size: 10pt;
      color: #111;
      background: #fff;
    }

    /* ── Watermark ── */
    .watermark {
      position: fixed;
      top: 50%;  left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      font-size: 80pt;
      font-weight: bold;
      color: rgba(200, 200, 200, 0.18);
      white-space: nowrap;
      pointer-events: none;
      z-index: -1;
    }

    /* ── Header ── */
    .page-header {
      border-bottom: 2px solid #003580;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    .page-header h1 {
      font-size: 16pt;
      color: #003580;
      letter-spacing: 0.5px;
    }
    .page-header .sub {
      font-size: 9pt;
      color: #555;
      margin-top: 2px;
    }
    .page-header .meta-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 9pt;
      color: #444;
    }

    /* ── Section ── */
    .section { margin-bottom: 16px; }
    .section-title {
      font-size: 11pt;
      font-weight: bold;
      color: #003580;
      border-bottom: 1px solid #ccc;
      padding-bottom: 3px;
      margin-bottom: 8px;
    }

    /* ── Data table ── */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9.5pt;
    }
    table.data-table th {
      background: #003580;
      color: #fff;
      padding: 5px 8px;
      text-align: left;
    }
    table.data-table td {
      padding: 5px 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    table.data-table tr:nth-child(even) td { background: #f6f8fc; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 9pt;
      font-weight: bold;
      text-transform: uppercase;
    }
    .badge-cleared   { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .badge-deficient { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .badge-review    { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .badge-pass      { background: #d4edda; color: #155724; }
    .badge-fail      { background: #f8d7da; color: #721c24; }
    .badge-warn      { background: #fff3cd; color: #856404; }

    /* ── Score bar ── */
    .score-bar-wrap {
      background: #e9ecef;
      border-radius: 4px;
      height: 14px;
      width: 100%;
      margin-top: 4px;
    }
    .score-bar {
      height: 14px;
      border-radius: 4px;
    }
    .score-high   { background: #28a745; }
    .score-medium { background: #ffc107; }
    .score-low    { background: #dc3545; }

    /* ── Sign-off grid ── */
    .signoff-grid {
      display: flex;
      gap: 16px;
      margin-top: 16px;
    }
    .signoff-box {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 10px 12px;
    }
    .signoff-box .label { font-size: 8pt; color: #666; }
    .signoff-box .name  { font-size: 10pt; font-weight: bold; margin-top: 2px; }
    .signoff-box .sig-line {
      border-top: 1px solid #999;
      margin-top: 22px;
      padding-top: 3px;
      font-size: 7.5pt;
      color: #888;
    }

    /* ── Misc ── */
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    p { margin-bottom: 6px; }
    .mt-8 { margin-top: 8px; }
    .mt-16 { margin-top: 16px; }
    .page-break { page-break-after: always; }
    .no-break { page-break-inside: avoid; }
  </style>
</head>
<body>
  <div class="watermark">SAMPLE</div>

  {% block content %}{% endblock %}
</body>
</html>
