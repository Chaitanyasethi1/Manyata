version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ./rules:/app/rules          # live-reload rules.json
    environment:
      - PYTHONPATH=/app
      - SQLITE_URL=sqlite:///./uploads/aicte_validator.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
